name: Release

# Builds the X4 Pro firmware and attaches it to a draft GitHub release.
# Version: the pushed tag (vX.Y.Z), else the manual input, else `version` under
# [crossink] in platformio.ini, so bumping that line is the whole release step.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override, e.g. 1.0.0 (blank = platformio.ini version)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Resolve version
        run: |
          V="${RELEASE_VERSION#v}"
          if [ -z "$V" ]; then
            V="$(sed -n '/^\[crossink\]$/,/^\[/s/^version *= *//p' platformio.ini | head -1)"
          fi
          [ -n "$V" ] || { echo "::error::no version found"; exit 1; }
          echo "RELEASE_VERSION=$V" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-py3.14-core6.1.19-x4-pro-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          # custom_sdkconfig runs a nested `pio run` from ~/.platformio/penv;
          # keep it on the outer core's version.
          pio pkg install -e x4-pro
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"

      - name: Set release version
        run: sed -i "/^\[crossink\]$/,/^\[/s/^version = .*/version = $RELEASE_VERSION/" platformio.ini

      - name: Build x4-pro firmware
        env:
          CROSSINK_RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: pio run -j1 -e x4-pro

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          name: CrossRhythm v${{ env.RELEASE_VERSION }}
          draft: true
          fail_on_unmatched_files: true
          files: .pio/build/x4-pro/firmware-x4-pro-v${{ env.RELEASE_VERSION }}.bin
