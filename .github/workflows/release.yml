name: Release

# Builds the X4 Pro firmware and attaches it to a draft GitHub release.
# Version: the pushed tag (vX.Y.Z), else the manual input. There is no fallback:
# `version` in platformio.ini tracks the CrossInk base and is not the release number.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 1.0.0 (no leading v)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Resolve version
        run: |
          V="${RELEASE_VERSION#v}"
          [ -n "$V" ] || { echo "::error::no version: push a v* tag or pass the version input"; exit 1; }
          echo "RELEASE_VERSION=$V" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-py3.14-core6.1.19-x4-pro-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          # custom_sdkconfig runs a nested `pio run` from ~/.platformio/penv;
          # keep it on the outer core's version.
          pio pkg install -e x4-pro
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"

      - name: Read CrossInk base version
        run: |
          BASE="$(sed -n '/^\[crossink\]$/,/^\[/s/^version *= *//p' platformio.ini | head -1)"
          echo "CROSSINK_BASE=$BASE" >> "$GITHUB_ENV"

      - name: Set release version
        run: sed -i "/^\[crossink\]$/,/^\[/s/^version = .*/version = $RELEASE_VERSION/" platformio.ini

      - name: Build x4-pro firmware
        env:
          CROSSINK_RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: pio run -j1 -e x4-pro

      - name: Write release notes
        run: |
          set -euo pipefail
          BIN=".pio/build/x4-pro/firmware-x4-pro-v${RELEASE_VERSION}.bin"
          (cd "$(dirname "$BIN")" && sha256sum "$(basename "$BIN")" > "$(basename "$BIN").sha256")
          SHA="$(cut -d' ' -f1 "$BIN.sha256")"
          SIZE="$(du -h "$BIN" | cut -f1)"
          cat > release-notes.md <<NOTES
          Based on [CrossInk ${CROSSINK_BASE}](https://github.com/uxjulia/CrossInk/releases/tag/v${CROSSINK_BASE}). Built from commit \`${GITHUB_SHA::7}\`.

          ## Install
          1. Back up \`/.crosspoint/\` on your SD card.
          2. Copy \`firmware-x4-pro-v${RELEASE_VERSION}.bin\` to the card.
          3. Install it from **Settings › System › SD Card Firmware Update**.

          Built and tested on the **Xteink X4 Pro** only. Indic books need the matching font folder in \`/.fonts/\`. Stock CrossInk can be flashed back at any time; your stats files are not changed.

          | File | Size | SHA-256 |
          | --- | --- | --- |
          | \`firmware-x4-pro-v${RELEASE_VERSION}.bin\` | ${SIZE} | \`${SHA}\` |

          See the [README](https://github.com/${GITHUB_REPOSITORY}#readme) for features and the [CHANGELOG](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/CHANGELOG.md) for details.

          ## What's changed
          NOTES

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          name: CrossRhythm v${{ env.RELEASE_VERSION }}
          draft: true
          body_path: release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            .pio/build/x4-pro/firmware-x4-pro-v${{ env.RELEASE_VERSION }}.bin
            .pio/build/x4-pro/firmware-x4-pro-v${{ env.RELEASE_VERSION }}.bin.sha256
