name: Release

# Builds the X4 Pro firmware and attaches it to a draft GitHub release.
# Manual only (a tag trigger would re-run this when you publish the draft, since
# publishing creates the tag). Version: the manual input, else the latest vX.Y.Z
# tag with the patch number +1 (1.0.0 for the first release). `version` in
# platformio.ini tracks the CrossInk base and is not the release number.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional override, e.g. 1.2.0 (blank = next patch version)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  fonts:
    # Indic font packs for the SD card (one zip per script, unzip into /.fonts/).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install font tools
        run: pip install -r lib/EpdFont/scripts/requirements.txt

      - name: Build Indic font packs
        run: |
          python3 lib/EpdFont/scripts/build-sd-fonts.py \
            --only NotoSansKannada,NotoSansTelugu,NotoSansTamil,NotoSansDevanagari,NotoSansMalayalam,NotoSansBengali,NotoSansOriya \
            --output-dir .pio/sd-fonts

      - uses: actions/upload-artifact@v7
        with:
          name: sd-fonts
          path: .pio/sd-fonts/*.zip
          if-no-files-found: error

  release:
    needs: fonts
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        run: |
          V="${RELEASE_VERSION#v}"
          if [ -z "$V" ]; then
            LAST="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
            if [ -z "$LAST" ]; then
              V="1.0.0"
            else
              IFS=. read -r MA MI PA <<< "${LAST#v}"
              V="$MA.$MI.$((PA + 1))"
            fi
          fi
          echo "RELEASE_VERSION=$V" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-py3.14-core6.1.19-x4-pro-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          # custom_sdkconfig runs a nested `pio run` from ~/.platformio/penv;
          # keep it on the outer core's version.
          pio pkg install -e x4-pro
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"

      - name: Read CrossInk base version
        run: |
          BASE="$(sed -n '/^\[crossink\]$/,/^\[/s/^version *= *//p' platformio.ini | head -1)"
          echo "CROSSINK_BASE=$BASE" >> "$GITHUB_ENV"

      - name: Set release version
        run: sed -i "/^\[crossink\]$/,/^\[/s/^version = .*/version = $RELEASE_VERSION/" platformio.ini

      - name: Build x4-pro firmware
        env:
          CROSSINK_RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: pio run -j1 -e x4-pro

      - uses: actions/download-artifact@v7
        with:
          name: sd-fonts
          path: release-files

      - name: Collect release files
        run: |
          set -euo pipefail
          cp ".pio/build/x4-pro/firmware-x4-pro-v${RELEASE_VERSION}.bin" release-files/
          cp assets/scenes/*.rhythmscene release-files/
          zip -j release-files/CrossRhythm-page-overlays.zip assets/page-overlays/*.bmp
          (cd release-files && sha256sum * > SHA256SUMS.txt)

      - name: Write release notes
        run: |
          set -euo pipefail
          FW="firmware-x4-pro-v${RELEASE_VERSION}.bin"
          BRAND="https://github.com/${GITHUB_REPOSITORY}/raw/${GITHUB_SHA}/docs/images/brand/mono"
          SHA="$(grep " ${FW}\$" release-files/SHA256SUMS.txt | cut -d' ' -f1)"

          # This version's CHANGELOG section, else [Unreleased].
          section() {
            awk -v h="$1" 'index($0, "## [" h "]") == 1 {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md
          }
          CHANGES="$(section "v${RELEASE_VERSION}")"
          [ -n "$CHANGES" ] || CHANGES="$(section "${RELEASE_VERSION}")"
          [ -n "$CHANGES" ] || CHANGES="$(section "Unreleased")"
          if [ -z "$CHANGES" ]; then
            echo "::error::no CHANGELOG section for ${RELEASE_VERSION} or Unreleased"
            exit 1
          fi

          cat > release-notes.md <<NOTES
          Based on [CrossInk ${CROSSINK_BASE}](https://github.com/uxjulia/CrossInk/releases/tag/v${CROSSINK_BASE}). Built from commit \`${GITHUB_SHA::7}\`. Built and tested on the **Xteink X4 Pro** only.

          ## Install
          1. Back up \`/.crosspoint/\` on your SD card.
          2. Copy \`${FW}\` to the card.
          3. Install it from **Settings › System › SD Card Firmware Update**.

          Later updates come through **Settings › Check for Updates**. To go back, flash a stock CrossInk release: your stats files are not changed.

          ## Optional files for the SD card
          | Download | Copy to | For |
          | --- | --- | --- |
          | \`NotoSans<Script>.zip\` (Kannada, Telugu, Tamil, Devanagari, Malayalam, Bengali, Odia) | unzip into \`/.fonts/\` | Books in that script (Devanagari covers Hindi, Marathi and Sanskrit; Bengali and Odia are experimental) |
          | \`*.rhythmscene\` (Lalbagh, KR Market, State Library) | \`/.scenes/\` | More Charging Animation and City Scape scenes (Glass House is built in) |
          | \`CrossRhythm-page-overlays.zip\` | unzip into \`/.sleep/\` | Page Overlay sleep screen wallpapers |

          If you opened a book in a script before installing its font, choose **Delete Book Cache** in the reader menu.

          ## Changes
          ${CHANGES}

          ## Checksums
          SHA-256 of \`${FW}\`: \`${SHA}\`. All files are listed in \`SHA256SUMS.txt\`.

          Scene maps are © [OpenStreetMap](https://www.openstreetmap.org/copyright) contributors (ODbL). Fonts are Noto Sans (SIL Open Font License 1.1). See the [README](https://github.com/${GITHUB_REPOSITORY}#readme) for details.

          <p align="center">
            <picture>
              <source media="(prefers-color-scheme: dark)" srcset="${BRAND}/gandaberunda-white.png" />
              <img src="${BRAND}/gandaberunda-black.png" height="64" alt="The gandaberunda, the two-headed bird of Karnataka, in dots" />
            </picture>
            &nbsp;
            <picture>
              <source media="(prefers-color-scheme: dark)" srcset="${BRAND}/made-in-bengaluru-white.png" />
              <img src="${BRAND}/made-in-bengaluru-black.png" height="56" alt="Made in Bengaluru." />
            </picture>
          </p>

          NOTES

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          name: CrossRhythm v${{ env.RELEASE_VERSION }}
          draft: true
          body_path: release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-files/*
