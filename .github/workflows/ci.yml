name: CI

on:
  push:
    branches: [main, release-01]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build and run host tests
        run: |
          cmake -S test -B build-tests
          cmake --build build-tests -j 4
          ctest --test-dir build-tests --output-on-failure

  build-x4-pro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          # Not the penv: it is tied to the runner's Python.
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-py3.14-core6.1.19-x4-pro-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Build x4-pro firmware
        run: |
          set -euo pipefail
          pio run -j1 -e x4-pro | tee pio-x4-pro.log

      - name: Firmware size summary
        run: |
          {
            echo "## x4-pro firmware build"
            grep -E "RAM:\s|Flash:\s" pio-x4-pro.log | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
